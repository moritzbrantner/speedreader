[package]
name = "document-extraction"
version = "0.0.0"
edition = "2021"

[dependencies]
lopdf = "0.38.0"
moenarch-image-analysis-ocr = { git = "https://github.com/moritzbrantner/visual-analysis", rev = "49fb183e9ffdc13fa12eb88cf444e15ce9f9ffb1", optional = true }
semantic-core = { package = "moenarch-semantic-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "b7533cd02269124deece75b76477ca55a853cd77" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["structured-ocr"]
structured-ocr = ["dep:moenarch-image-analysis-ocr"]

[dev-dependencies]
serde_json = "=1.0.151"
