[package]
name = "document-extraction"
version = "0.0.0"
edition = "2021"

[dependencies]
lopdf = "0.38.0"
moenarch-image-analysis-ocr = { git = "https://github.com/moritzbrantner/visual-analysis", rev = "7eb2898f23b491a857fe227d9773d49c2b320ddf", optional = true }
semantic-core = { package = "moenarch-semantic-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["structured-ocr"]
structured-ocr = ["dep:moenarch-image-analysis-ocr"]

[dev-dependencies]
serde_json = "=1.0.151"
