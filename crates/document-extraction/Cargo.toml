[package]
name = "document-extraction"
version = "0.0.0"
edition = "2021"

[dependencies]
lopdf = "0.47.0"
moenarch-image-analysis-ocr = { git = "https://github.com/moritzbrantner/visual-analysis", rev = "62241d2f3d45fb36f30500186d0e21cd59e19841", optional = true }
semantic-core = { package = "moenarch-semantic-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "865ce48ac8f561d0cd552473b905a550b702aa4e" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["structured-ocr"]
structured-ocr = ["dep:moenarch-image-analysis-ocr"]

[dev-dependencies]
serde_json = "=1.0.154"
