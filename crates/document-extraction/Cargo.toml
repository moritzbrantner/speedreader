[package]
name = "document-extraction"
version = "0.0.0"
edition = "2021"

[dependencies]
lopdf = "0.47.0"
moenarch-image-analysis-ocr = { git = "https://github.com/moritzbrantner/visual-analysis", rev = "410f7106f71b24fe3ad3731cfb181b0c4fa6353b", optional = true }
semantic-core = { package = "moenarch-semantic-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "779e7badda422f380edceff855036bf16876b702" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["structured-ocr"]
structured-ocr = ["dep:moenarch-image-analysis-ocr"]

[dev-dependencies]
serde_json = "=1.0.154"
