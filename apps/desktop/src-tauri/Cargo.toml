[package]
name = "speedreader-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
document-extraction = { path = "../../../crates/document-extraction" }
hayro = "0.8.0"
image-analysis-core = { package = "moenarch-image-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776", features = ["local-onnx"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
video-analysis-core = { package = "moenarch-video-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
