[package]
name = "speedreader-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
document-extraction = { path = "../../../crates/document-extraction" }
hayro = "0.9.0"
image-analysis-core = { package = "moenarch-image-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "62241d2f3d45fb36f30500186d0e21cd59e19841" }
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", git = "https://github.com/moritzbrantner/visual-analysis", rev = "62241d2f3d45fb36f30500186d0e21cd59e19841", features = ["local-onnx"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
video-analysis-core = { package = "moenarch-video-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "62241d2f3d45fb36f30500186d0e21cd59e19841" }
