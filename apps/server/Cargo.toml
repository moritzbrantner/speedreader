[package]
name = "speedreader-server"
version = "0.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
document-extraction = { path = "../../crates/document-extraction" }
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
