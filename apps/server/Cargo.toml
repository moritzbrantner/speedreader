[package]
name = "speedreader-server"
version = "0.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
document-extraction = { path = "../../crates/document-extraction" }
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", git = "https://github.com/moritzbrantner/visual-analysis", rev = "410f7106f71b24fe3ad3731cfb181b0c4fa6353b" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
