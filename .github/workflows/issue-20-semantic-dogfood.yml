name: Issue 20 semantic dogfood patch

on:
  push:
    branches:
      - feat/20-semantic-document-annotations
    paths:
      - .github/workflows/issue-20-semantic-dogfood.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20-semantic-document-annotations
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Wire semantic projection into document extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/document-extraction/src/lib.rs')
          text = path.read_text()
          marker = 'use thiserror::Error;\n\npub const READING_DOCUMENT_VERSION: u8 = 1;'
          replacement = '''use thiserror::Error;\n\nmod semantic;\npub use semantic::{document_role_concept, semantic_annotations};\n\npub const READING_DOCUMENT_VERSION: u8 = 1;'''
          if text.count(marker) != 1:
              raise SystemExit('expected one document-extraction module insertion point')
          path.write_text(text.replace(marker, replacement))
          PY

      - name: Resolve exact Foundation source dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p document-extraction
          git diff -- Cargo.lock
          git diff --check

      - name: Focused verification
        run: |
          cargo fmt --all
          cargo test -p document-extraction
          cargo check --workspace
          git diff --check

      - name: Commit generated integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/document-extraction/src/lib.rs crates/document-extraction/src/semantic.rs
          git commit -m 'Dogfood semantic-core document annotations'
          git push origin HEAD:feat/20-semantic-document-annotations
