name: Deploy speedreader to GitHub Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is job-level on purpose: runs that are skipped (failed CI,
# stale commits) never acquire the deployment slots, so they cannot cancel
# a deployment of the current main tip.

jobs:
  gate:
    name: Confirm source is the current main tip
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Compare CI head with main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$tip" == "$HEAD_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale CI completion for $HEAD_SHA; main is at $tip."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  browser-runtime:
    name: Reuse validated browser runtime
    needs: gate
    if: ${{ needs.gate.outputs.deploy == 'true' }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@b14fb03c3d775c682b92a49954e4d6f43aa9e281
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: speedreader-browser-runtime-v2
      bun_version: "1.4.0"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      cargo_tool_cache_key: rust-1.98.1-wasm-bindgen-cli-0.2.127
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-bindgen-cli --version 0.2.127 --locked
      build_command: |
        bun run wasm:build
        rm -rf .artifacts/browser-runtime
        mkdir -p .artifacts/browser-runtime
        cp -R apps/web/public/wasm .artifacts/browser-runtime/wasm
        cp -R apps/web/public/pdfjs .artifacts/browser-runtime/pdfjs
        mkdir -p .artifacts/browser-runtime/vendor
        cp -R apps/web/public/vendor/settings .artifacts/browser-runtime/vendor/settings
      artifact_paths: .artifacts/browser-runtime
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 30

  build:
    name: Compose Pages from verified browser runtime
    needs: browser-runtime
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-build
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.browser-runtime.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified browser runtime
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@b14fb03c3d775c682b92a49954e4d6f43aa9e281
        with:
          producer_run_id: ${{ needs.browser-runtime.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.browser-runtime.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.browser-runtime.outputs.artifact_name }}
          artifact_digest: ${{ needs.browser-runtime.outputs.artifact_digest }}
          source_sha: ${{ needs.browser-runtime.outputs.source_sha }}
          artifact_key: ${{ needs.browser-runtime.outputs.artifact_key }}
          identity_digest: ${{ needs.browser-runtime.outputs.identity_digest }}
          destination_path: .artifacts/verified-browser-runtime
          github_token: ${{ github.token }}

      - name: Stage browser runtime
        run: |
          rm -rf apps/web/public/wasm apps/web/public/pdfjs apps/web/public/vendor/settings
          mkdir -p apps/web/public/vendor
          cp -R .artifacts/verified-browser-runtime/wasm apps/web/public/wasm
          cp -R .artifacts/verified-browser-runtime/pdfjs apps/web/public/pdfjs
          cp -R .artifacts/verified-browser-runtime/vendor/settings apps/web/public/vendor/settings

      - name: Build static web app
        env:
          GITHUB_PAGES: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun --filter @speedreader/web build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/out

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main tip before deploying
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$tip" == "$HEAD_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying stale $HEAD_SHA; main moved to $tip."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.tip.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
