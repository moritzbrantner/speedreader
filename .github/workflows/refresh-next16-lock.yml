name: Refresh Next 16 lockfile

on:
  push:
    branches:
      - feat/github-pages-next16-app-router
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-next16-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/github-pages-next16-app-router
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Refresh workspace lockfile
        run: bun install
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh lockfile for Next 16.3.4"
          git fetch origin feat/github-pages-next16-app-router
          git rebase origin/feat/github-pages-next16-app-router
          git push origin HEAD:feat/github-pages-next16-app-router
